name: Python regression tests

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile desktop UI entry point
        run: python -m py_compile main.py
      - name: Install runtime dependencies used by regression tests
        run: python -m pip install cryptography==48.0.0 python-dotenv==1.2.2 python-dateutil==2.9.0.post0
      - name: Run regression tests
        run: python -m unittest discover -v
